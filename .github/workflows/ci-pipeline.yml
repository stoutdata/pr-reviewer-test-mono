name: ci-pipeline

# Umbrella PR pipeline, mirroring the firmware-mono shape: a paths-filter
# fans out to per-product reusable build workflows. Because the product
# workflows are `workflow_call` children, their artifacts attach to THIS
# workflow's run — so every product's PR reviewer points its build workflow
# at `ci-pipeline.yml` and disambiguates by artifact-name pattern.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed products
    runs-on: ubuntu-22.04
    # An explicit permissions block REPLACES the defaults — checkout still
    # needs contents:read (a private repo 404s as "not found" without it).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      blinka: ${{ steps.filter.outputs.blinka }}
      blinkb: ${{ steps.filter.outputs.blinkb }}
      voltmon: ${{ steps.filter.outputs.voltmon }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            blinka:
              - 'blinka/**'
              - 'common/**'
              - '.github/workflows/blinka-pr.yml'
              - '.github/workflows/ci-pipeline.yml'
            blinkb:
              - 'blinkb/**'
              - 'common/**'
              - '.github/workflows/blinkb-pr.yml'
              - '.github/workflows/ci-pipeline.yml'
            voltmon:
              - 'voltmon/**'
              - 'common/**'
              - '.github/workflows/voltmon-pr.yml'
              - '.github/workflows/ci-pipeline.yml'

  build-blinka:
    name: blinka
    needs: changes
    if: needs.changes.outputs.blinka == 'true'
    uses: ./.github/workflows/blinka-pr.yml

  build-blinkb:
    name: blinkb
    needs: changes
    if: needs.changes.outputs.blinkb == 'true'
    uses: ./.github/workflows/blinkb-pr.yml

  build-voltmon:
    name: voltmon
    needs: changes
    if: needs.changes.outputs.voltmon == 'true'
    uses: ./.github/workflows/voltmon-pr.yml
